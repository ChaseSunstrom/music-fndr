services:
  music-findr:
    build: .
    image: music-findr:latest
    container_name: music-findr
    network_mode: host
    environment:
      - PORT=8800
      # - QUALITY=m4a     # m4a or opus (the source audio as it is), mp3-320 or mp3-128; the app can change it
      # - FORMAT=mp3      # mp3, flac, ogg, opus, m4a or wav
      # - BITRATE=128k    # e.g. 320k, or "disable" to keep the source quality
      # - OUTPUT={album-artist}/{album}/{track-number} - {title}.{output-ext}
      # - THREADS=4       # songs downloaded at once
      # - SYNC_HOURS=24   # re-sync saved playlists; 0 = off
      # - YT_DLP_ARGS=--sleep-requests 1 --sleep-interval 3 --max-sleep-interval 8   # pacing; empty = full speed
      # - JELLYFIN_URL=http://localhost:8096   # create playlists in Jellyfin
      # - JELLYFIN_API_KEY=                    # Dashboard > API Keys
    volumes:
      - ${MUSIC_DIR:-/data/music}:/music
    init: true            # passes stop signals on while the start-up yt-dlp update runs
    restart: unless-stopped
